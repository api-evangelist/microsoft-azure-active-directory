specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Microsoft Azure Active Directory
providerId: microsoft-azure-active-directory
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: true
tags:
  - Rate Limiting
  - Identity
  - Microsoft Entra
description: Microsoft Entra ID is consumed primarily through Microsoft Graph. Throttling is applied
  per app, per tenant, and per service using a token-bucket algorithm. Limits are not plan-scoped; they
  are global to the Graph service. From September 30, 2025 the per-app/per-tenant cap is half of the
  total per-tenant limit so a single app cannot consume the full tenant quota.
sources:
  - https://learn.microsoft.com/en-us/graph/throttling
  - https://learn.microsoft.com/en-us/graph/throttling-limits
headers:
  retryAfter: Retry-After
  requestId: request-id
  clientRequestId: client-request-id
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: Global per-app limit
    scope: app
    metric: requests_per_10_seconds
    limit: 130000
    timeFrame: second
    notes: Universal cap of 130,000 requests per 10 seconds per app across all tenants.
  - name: Per-tenant general operations
    scope: tenant
    metric: requests_per_20_seconds
    limit: 2000
    timeFrame: second
    notes: 2,000 requests per 20 seconds tenant-wide; ~50 RPS sustained.
  - name: Per-app per-tenant general operations
    scope: app/tenant
    metric: requests_per_20_seconds
    limit: 1000
    timeFrame: second
    notes: 1,000 requests per 20 seconds for a single app per tenant.
  - name: Intune device management per-tenant
    scope: tenant
    metric: requests_per_20_seconds
    limit: 4000
    timeFrame: second
  - name: Intune device management per-app per-tenant
    scope: app/tenant
    metric: requests_per_20_seconds
    limit: 2000
    timeFrame: second
  - name: Service-specific limits
    scope: app/tenant/service
    metric: varies
    limit: 'see Microsoft Graph service-specific throttling limits'
policies:
  - name: Token-bucket algorithm
    description: Throttling sums weighted request costs against per-tenant and per-app buckets; only
      requests above the limit are throttled (HTTP 429).
  - name: Honor Retry-After
    description: When a 429 or 503 is returned, wait the duration in the Retry-After header before
      retrying.
  - name: Backoff with jitter
    description: Use exponential backoff with jitter on transient errors to avoid synchronized retry
      storms across distributed callers.
  - name: Use batching and delta queries
    description: Reduce request count using $batch, delta queries, change notifications, and selecting
      only required properties.
  - name: Bulk extracts via Data Connect
    description: Microsoft Graph Data Connect supports bulk extraction of Microsoft 365 data without
      Graph throttling limits.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com

specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Microsoft Azure Active Directory
providerId: microsoft-azure-active-directory
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Authentication
  - Authorization
  - Identity
  - Microsoft Entra
  - OAuth
  - OpenID Connect
  - SAML
  - SCIM
  - Single Sign-On
description: Microsoft Entra ID (formerly Azure Active Directory) is licensed per user per month, on
  top of a Free baseline included with Microsoft cloud subscriptions. P1 and P2 add advanced security
  and identity protection; the Entra Suite bundles network access, governance, and verification on top
  of P1/P2. External ID, Workload ID, Internet/Private Access, ID Governance, and Verified ID are sold
  as standalone add-ons.
sources:
  - https://www.microsoft.com/en-us/security/business/microsoft-entra-pricing
  - https://azure.microsoft.com/en-us/pricing/details/active-directory/
plans:
  - id: microsoft-azure-active-directory-free
    name: Microsoft Entra ID Free
    type: freemium
    description: Included at no cost with Microsoft cloud subscriptions (Azure, Microsoft 365). Provides
      MFA, unlimited SSO across SaaS apps, and basic reports.
    entries:
      - label: Per user
        name: entra_id_free
        type: subscription
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: true
    elements:
      - name: Multifactor authentication
      - name: Unlimited SSO across SaaS apps
      - name: Basic reports
      - name: Self-service password change for cloud users
  - id: microsoft-azure-active-directory-p1
    name: Microsoft Entra ID P1
    type: subscription
    description: Advanced identity management for hybrid environments with conditional access, MFA,
      and self-service password management. Annual commitment.
    entries:
      - label: Per user / month
        name: entra_id_p1
        type: subscription
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '6.00'
        userMultiplied: true
    elements:
      - name: Conditional access
      - name: Multifactor authentication
      - name: Self-service password reset for hybrid identities
      - name: Application proxy
  - id: microsoft-azure-active-directory-p2
    name: Microsoft Entra ID P2
    type: subscription
    description: Adds identity protection (risk-based conditional access, real-time threat assessment)
      and Privileged Identity Management. Annual commitment.
    entries:
      - label: Per user / month
        name: entra_id_p2
        type: subscription
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '9.00'
        userMultiplied: true
    elements:
      - name: Identity Protection (risk-based conditional access)
      - name: Privileged Identity Management
      - name: Access reviews
      - name: All P1 features
  - id: microsoft-azure-active-directory-suite
    name: Microsoft Entra Suite
    type: subscription
    description: Bundle combining network access, identity protection, governance, and verification.
      Requires P1 or P2 subscription.
    entries:
      - label: Per user / month (add-on)
        name: entra_suite
        type: subscription
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '12.00'
        userMultiplied: true
    elements:
      - name: Microsoft Entra Internet Access
      - name: Microsoft Entra Private Access
      - name: Microsoft Entra ID Governance
      - name: Microsoft Entra Verified ID premium
      - name: Microsoft Entra ID Protection
  - id: microsoft-azure-active-directory-internet-access
    name: Microsoft Entra Internet Access
    type: subscription
    description: Standalone secure web gateway / SSE component.
    entries:
      - label: Per user / month
        name: entra_internet_access
        type: subscription
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '5.00'
        userMultiplied: true
    elements:
      - name: SaaS access controls
      - name: Web content filtering
      - name: Threat protection
  - id: microsoft-azure-active-directory-private-access
    name: Microsoft Entra Private Access
    type: subscription
    description: Standalone identity-centric ZTNA for private apps.
    entries:
      - label: Per user / month
        name: entra_private_access
        type: subscription
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '5.00'
        userMultiplied: true
    elements:
      - name: ZTNA for private apps
      - name: Per-app conditional access
      - name: Identity-aware proxy
  - id: microsoft-azure-active-directory-governance
    name: Microsoft Entra ID Governance
    type: subscription
    description: Standalone identity governance with entitlement management, access reviews, and
      lifecycle workflows.
    entries:
      - label: Per user / month
        name: entra_id_governance
        type: subscription
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '7.00'
        userMultiplied: true
    elements:
      - name: Entitlement management
      - name: Lifecycle workflows
      - name: Access reviews
  - id: microsoft-azure-active-directory-workload-id
    name: Microsoft Entra Workload ID
    type: subscription
    description: Identity for service principals, managed identities, and workload identities.
    entries:
      - label: Per workload identity / month
        name: entra_workload_id
        type: subscription
        metric: workload_identity
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '3.00'
        userMultiplied: false
    elements:
      - name: Conditional access for workload identities
      - name: Identity Protection for workloads
      - name: Access reviews for workload identities
  - id: microsoft-azure-active-directory-external-id
    name: Microsoft Entra External ID
    type: usage-based
    description: CIAM for customers and partners. Free up to 50,000 monthly active users; usage-priced
      thereafter (see Azure pricing page).
    entries:
      - label: Monthly active users (first 50,000)
        name: external_id_mau_free
        type: quota
        metric: monthly_active_user
        limit: 50000
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Monthly active users (above 50,000)
        name: external_id_mau_paid
        type: metered
        metric: monthly_active_user
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: 'see https://azure.microsoft.com/en-us/pricing/details/active-directory/external-identities/'
        userMultiplied: false
    elements:
      - name: CIAM for customer-facing apps
      - name: Custom branding
      - name: Social and federated identity providers
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com

specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Microsoft Azure Active Directory
providerId: microsoft-azure-active-directory
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Authentication
  - Authorization
  - Identity
  - Microsoft
  - Microsoft Entra
  - OAuth
  - OpenID Connect
  - SAML
  - SCIM
  - Single Sign-On
  - Zero Trust
description: Microsoft Entra ID (formerly Azure Active Directory) is sold per-user-per-month as four
  tiers - Free (included with any Microsoft cloud service), Microsoft Entra ID P1, Microsoft Entra ID
  P2, and Microsoft Entra ID Governance. Add-on SKUs include Microsoft Entra Workload ID, External ID
  (B2C/B2B with monthly active user pricing), Verified ID, and Internet Access / Private Access.
sources:
  - https://www.microsoft.com/en-us/security/business/microsoft-entra-pricing
  - https://learn.microsoft.com/en-us/entra/fundamentals/licensing
plans:
  - id: microsoft-azure-active-directory-free
    name: Microsoft Entra ID Free
    type: freemium
    description: Included free with every Azure, Microsoft 365, Power Platform, and Dynamics 365 subscription.
      Up to 50,000 directory objects (300,000 with verified domain).
    entries:
      - label: Free tier
        name: free
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: User and group management
      - name: SSO to thousands of SaaS apps (limited)
      - name: B2B collaboration
      - name: Self-service password change for cloud users
      - name: Security defaults / MFA via security defaults
  - id: microsoft-azure-active-directory-p1
    name: Microsoft Entra ID P1
    type: subscription
    description: Premium identity and access management. $6 per user/month.
    entries:
      - label: P1 license
        name: p1
        type: subscription
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '6.00'
        userMultiplied: true
    elements:
      - name: Conditional Access
      - name: SaaS SSO unlimited
      - name: Self-service password reset for hybrid users
      - name: Application Proxy
      - name: Cloud App Discovery
      - name: Microsoft Entra Connect Health
  - id: microsoft-azure-active-directory-p2
    name: Microsoft Entra ID P2
    type: subscription
    description: P1 features plus risk-based identity protection and PIM. $9 per user/month.
    entries:
      - label: P2 license
        name: p2
        type: subscription
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '9.00'
        userMultiplied: true
    elements:
      - name: Identity Protection (risk-based Conditional Access)
      - name: Privileged Identity Management (PIM)
      - name: Access Reviews
      - name: All P1 features
  - id: microsoft-azure-active-directory-governance
    name: Microsoft Entra ID Governance
    type: subscription
    description: Identity lifecycle, entitlement management, and access reviews. $7 per user/month add-on
      (in addition to P1/P2).
    entries:
      - label: Governance license
        name: governance
        type: subscription
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '7.00'
        userMultiplied: true
    elements:
      - name: Entitlement management
      - name: Lifecycle workflows
      - name: Access certifications / reviews
      - name: Separation of duties
  - id: microsoft-azure-active-directory-external-id
    name: Microsoft Entra External ID
    type: usage-based
    description: Customer/partner identity (CIAM). Billed by Monthly Active Users (MAU) with a 50,000-MAU
      free tier.
    entries:
      - label: First 50K MAU
        name: external_free
        type: quota
        metric: monthly_active_user
        limit: 50000
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: MAU above free tier
        name: external_paid
        type: metered
        metric: monthly_active_user
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: see Microsoft Entra External ID pricing page
        userMultiplied: false
    elements:
      - name: B2C / customer identity flows
      - name: Custom branding
      - name: Social and local accounts
  - id: microsoft-azure-active-directory-workload-id
    name: Microsoft Entra Workload ID
    type: subscription
    description: Conditional Access, identity protection, and lifecycle for service principals / managed
      identities.
    entries:
      - label: Workload ID Premium
        name: workload_id
        type: subscription
        metric: workload_identity
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: see Workload ID pricing page
        userMultiplied: false
    elements:
      - name: Conditional Access for workloads
      - name: Workload ID risk detection
      - name: Access reviews for service principals
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com

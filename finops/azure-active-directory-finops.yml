principles:
  - name: Visibility
    description: Use the Microsoft Entra admin center license usage report and Microsoft 365 admin center
      billing exports to track P1/P2/Governance assignments and External ID MAU consumption.
  - name: Allocation
    description: Tag licensed users via department / cost-center attributes synced from HR; allocate
      External ID MAU costs to consuming customer apps via app metadata.
  - name: Optimization
    description: Reclaim unused P1/P2 licenses via Microsoft Entra access reviews and lifecycle workflows;
      consolidate guest invitations under External ID where pay-per-MAU is cheaper than per-seat licensing.
  - name: Accountability
    description: Assign IAM admins as license budget owners; review license assignments quarterly through
      Entra ID Governance access reviews.

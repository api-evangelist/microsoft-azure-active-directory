principles:
  - name: Visibility
    description: Use the Microsoft 365 admin center license usage reports and Azure Cost Management
      to view Entra ID, External ID, and add-on consumption. Export usage to a Log Analytics workspace
      for detailed reporting.
  - name: Allocation
    description: Tag licensed users via Microsoft 365 license groups and Entra group-based licensing
      to attribute spend to departments and cost centers.
  - name: Optimization
    description: Reclaim unused P1/P2 licenses with access reviews; right-size between Free, P1, and
      P2 based on per-user feature consumption; switch eligible CIAM workloads from B2C legacy to
      External ID free MAU tier.
  - name: Accountability
    description: Assign license budget owners per business unit; review annually at Microsoft Enterprise
      Agreement true-up; alert on access-review completions and over-provisioning.
maintainers:

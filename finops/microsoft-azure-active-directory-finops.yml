      - department
  - name: entra_id_seat_p2
    unit: seat-month
    aggregation: sum
    dimensions:
      - tenant
      - department
  - name: entra_suite_seat
    unit: seat-month
    aggregation: sum
  - name: entra_id_governance_seat
    unit: seat-month
    aggregation: sum
  - name: entra_internet_access_seat
    unit: seat-month

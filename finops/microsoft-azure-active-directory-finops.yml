description: 'FOCUS-aligned FinOps for Microsoft Entra ID: per-user-per-month subscription licenses
  (Free, P1, P2, Suite) plus standalone add-ons (Internet/Private Access, ID Governance, Workload ID)
  and usage-based External ID monthly active users.'
